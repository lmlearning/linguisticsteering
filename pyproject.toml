[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segshap"
version = "0.1.0"
description = "Certified segment-level Shapley attribution for LLM prompts with a budgeted noisy oracle"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
llm = ["openai"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["segshap*"]
